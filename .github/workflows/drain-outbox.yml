# Drains the email outbox on a schedule, for hosts without a cron of their own.
#
# Set two repository secrets and the job starts working:
#   DRAIN_URL    https://<host>/api/cron/drain-outbox
#   CRON_SECRET  the deployment's CRON_SECRET
# Without them every run is skipped, so the workflow is safe to commit as-is.
name: Drain email outbox

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drain
        env:
          DRAIN_URL: ${{ secrets.DRAIN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DRAIN_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "DRAIN_URL / CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "authorization: Bearer $CRON_SECRET" "$DRAIN_URL"
